<style>/* Rendez-vous Campus — map-first layout like the big mobility apps:
   the map fills the screen; the planner floats over it (left card on a computer, bottom sheet on a phone);
   floors are picked on the map, Google-Maps-indoor style; trips read as big times + journey chips. */
:root {
  --bg: #eceff3;            /* map ground */
  --surface: #ffffff;       /* cards, sheet */
  --surface-2: #f4f6f8;     /* inputs, hover */
  --ink: #12161d;
  --muted: #646d7a;
  --line: #e2e6ec;
  --accent: #0b9f6e;        /* primary action + meeting point */
  --accent-ink: #ffffff;
  --accent-soft: #e3f6ee;
  --warn: #d9363e;
  --pa: #2563eb;            /* person A */
  --pb: #f26b1d;            /* person B */
  --pc: #a33fd6;            /* person C */
  --pd: #e11d48; --pe: #b7791f; --pf: #0e8fae;   /* persons D, E, F */
  /* map drawing */
  --map-bg: #eceff3; --building: #dde1e7; --building-uni: #cfd9ee; --building-line: #c4cad3;
  --road: #ffffff; --path: #ffffff; --steps: #9aa3af;
  --floor: #ffffff; --corridor: #e7eaee; --room: #f1f3f6; --room-line: #b7bec9;
  /* compatibility names used by the map code */
  --panel: var(--surface); --soft: var(--surface-2); --meet: var(--accent);
  --font: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 18px;
  --shadow: 0 10px 30px rgba(18, 22, 29, .12), 0 2px 6px rgba(18, 22, 29, .06);
  --shadow-sm: 0 2px 8px rgba(18, 22, 29, .10);
  --sheet-w: 404px;
  --sheet-offset: 0px;      /* how much of the map the sheet covers at the bottom (phone) */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --surface: #171b22; --surface-2: #20252e; --ink: #eef1f5; --muted: #9aa3b0; --line: #2a303a;
    --accent: #2bc48a; --accent-ink: #06261a; --accent-soft: #143528; --warn: #ff6b6b;
    --pa: #5b8cff; --pb: #ff8a3d; --pc: #c77dff; --pd: #fb6f8c; --pe: #e8b04a; --pf: #3cc3e0;
    --map-bg: #12161c; --building: #232933; --building-uni: #263452; --building-line: #303744;
    --road: #2b313b; --path: #262c35; --steps: #6b7480;
    --floor: #1d222a; --corridor: #2a303a; --room: #232831; --room-line: #46505e;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3); --shadow-sm: 0 2px 8px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #171b22; --surface-2: #20252e; --ink: #eef1f5; --muted: #9aa3b0; --line: #2a303a;
  --accent: #2bc48a; --accent-ink: #06261a; --accent-soft: #143528; --warn: #ff6b6b;
  --pa: #5b8cff; --pb: #ff8a3d; --pc: #c77dff; --pd: #fb6f8c; --pe: #e8b04a; --pf: #3cc3e0;
  --map-bg: #12161c; --building: #232933; --building-uni: #263452; --building-line: #303744;
  --road: #2b313b; --path: #262c35; --steps: #6b7480;
  --floor: #1d222a; --corridor: #2a303a; --room: #232831; --room-line: #46505e;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3); --shadow-sm: 0 2px 8px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; color: inherit; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--pa); outline-offset: 2px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.app { position: relative; height: 100%; overflow: hidden; }

/* ---------------------------------------------------------------- map */
.map-wrap { position: absolute; inset: 0; }
#map, #map3d { position: absolute; inset: 0; background: var(--map-bg); }
.leaflet-container { background: var(--map-bg); font-family: var(--font); }
.leaflet-bottom { bottom: var(--sheet-offset); transition: bottom .25s ease; }
.leaflet-control-zoom { border: 0 !important; box-shadow: var(--shadow-sm) !important; border-radius: 12px !important; overflow: hidden; }
.leaflet-control-zoom a { background: var(--surface) !important; color: var(--ink) !important; border-color: var(--line) !important; width: 38px !important; height: 38px !important; line-height: 38px !important; }
.leaflet-control-attribution { font-size: 10px; background: color-mix(in srgb, var(--surface) 80%, transparent) !important; color: var(--muted); }
.leaflet-control-attribution a { color: var(--muted); }
.map3d-msg { margin: 0; padding: 120px 24px 24px calc(var(--sheet-w) + 40px); color: var(--muted); }
.maplibregl-ctrl-bottom-right { bottom: var(--sheet-offset); }
.maplibregl-ctrl-group { background: #ffffff; border-radius: 12px !important; box-shadow: var(--shadow-sm) !important; }

/* map view switch (top right) */
.map-style {
  position: absolute; z-index: 800; top: max(16px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; padding: 4px; gap: 2px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-sm);
}
.map-style button { border: 0; background: none; padding: 8px 14px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 13px; color: var(--muted); }
.map-style button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

/* floor picker (right edge), like indoor maps */
.floors {
  position: absolute; z-index: 800; right: max(16px, env(safe-area-inset-right, 0px)); top: 76px;
  display: flex; flex-direction: column; padding: 4px; gap: 2px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-sm);
}
.floors button {
  position: relative; border: 0; background: none; cursor: pointer; min-width: 52px; min-height: 40px; padding: 6px 8px; border-radius: 12px;
  font-weight: 800; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
}
.floors button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.floors .floor-campus { border-top: 1px solid var(--line); border-radius: 0 0 12px 12px; margin-top: 2px; padding-top: 8px; }
.floors .floor-campus svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.floors .dots { display: flex; gap: 2px; }
.floors .dots i { width: 6px; height: 6px; border-radius: 50%; display: block; }
.floors .dots i.meet-dot { background: var(--accent); }

.pick-hint {
  display: none; position: absolute; z-index: 900; left: 50%; top: max(16px, env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
  max-width: calc(100% - 32px); text-align: center; box-shadow: var(--shadow);
}
body.picking .pick-hint { display: block; }
body.picking #map { cursor: crosshair; }
.pick-hint .locate { margin-left: 8px; border: 0; padding: 0; background: none; color: inherit; text-decoration: underline; cursor: pointer; font: inherit; }

/* campus base map (OpenStreetMap data) */
.bm-building { fill: var(--building); fill-opacity: 1; stroke: var(--building-line); }
.bm-uni { fill: var(--building-uni); }
.bm-road { stroke: var(--road); stroke-opacity: 1; }
.bm-path { stroke: var(--path); stroke-opacity: 1; }
.bm-steps { stroke: var(--steps); stroke-opacity: 1; }
.bm-label span {
  display: inline-block; transform: translate(-50%, -150%); white-space: nowrap; pointer-events: none;
  font-weight: 600; font-size: 11px; color: var(--muted); text-shadow: 0 0 3px var(--map-bg), 0 0 3px var(--map-bg), 0 0 3px var(--map-bg);
}
.bm-label-c span { color: var(--ink); font-weight: 800; font-size: 12px; }
.bm-door { fill: var(--surface); fill-opacity: 1; stroke: var(--muted); }
#map.indoor .bm-building, #map.indoor .bm-road, #map.indoor .bm-path, #map.indoor .bm-steps { opacity: 0.35; }
#map.street .bm-building, #map.street .bm-road, #map.street .bm-path, #map.street .bm-steps { display: none; }
#map.street.indoor .osm-tiles { opacity: 0.4; }

/* indoor floors, drawn like the evacuation plans */
.area { stroke: var(--room-line); stroke-opacity: 1; fill-opacity: 1; }
.area-room { fill: var(--floor); }
.area-meetable { fill: color-mix(in srgb, var(--accent) 8%, var(--floor)); }
.area-corridor { fill: var(--corridor); }
.area-stairs { fill: var(--room); }
.area-elevator { fill: color-mix(in srgb, var(--accent) 22%, var(--room)); }
.area-wc, .area-service { fill: var(--room); }
.area-private { fill: var(--room); stroke-dasharray: 5 4; }
.area-void { fill: var(--map-bg); stroke-dasharray: 3 4; }
.room-label span { display: inline-block; transform: translate(-50%, -50%); white-space: nowrap; font-weight: 700; font-size: 12px; color: var(--ink); }
.room-label-minor span { font-weight: 600; color: var(--muted); font-size: 11px; }
.fixture { transform: translate(-50%, -50%); width: max-content !important; height: auto !important;
  font-weight: 700; font-size: 11px; line-height: 1; padding: 4px 7px; border-radius: 999px; background: var(--ink); color: var(--surface); }
.fixture-door { background: var(--accent); color: var(--accent-ink); }

/* markers */
.pin span {
  display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%;
  color: #fff; font-weight: 800; font-size: 14px; border: 3px solid var(--surface); box-shadow: var(--shadow-sm);
}
.pin-inside span { outline: 2px dashed currentColor; outline-offset: 2px; }
.pin small, .meet-pin small {
  position: absolute; left: 50%; top: 100%; transform: translate(-50%, 4px); white-space: nowrap;
  background: var(--ink); color: var(--surface); border-radius: 999px; padding: 2px 7px; font-weight: 800; font-size: 10px; line-height: 1.3;
}
.meet-pin span {
  display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50% 50% 50% 6px; transform: rotate(-45deg);
  background: var(--accent); border: 3px solid var(--surface); box-shadow: var(--shadow);
}
.meet-pin span svg { width: 20px; height: 20px; transform: rotate(45deg); fill: var(--accent-ink); }
.transition span {
  display: inline-block; white-space: nowrap; cursor: pointer; background: var(--surface); color: var(--ink);
  border: 2px solid; border-radius: 999px; padding: 4px 9px; font-weight: 800; font-size: 11px; box-shadow: var(--shadow-sm);
}
.graph-edge { stroke: var(--warn); stroke-opacity: 0.6; }
.graph-node { stroke: var(--warn); fill: var(--surface); fill-opacity: 1; }
.graph-node.meetable { fill: var(--accent); }
.walker span {
  display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; color: #fff;
  border: 3px solid #fff; box-shadow: 0 3px 12px rgba(0,0,0,.35);
}
.walker svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.maplibregl-marker.walker { z-index: 5; }
.play-dot span {
  display: block; width: 22px; height: 22px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 2px 10px rgba(0,0,0,.35);
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 50% { transform: scale(1.2); } }

/* ---------------------------------------------------------------- planner sheet */
.sheet {
  position: absolute; z-index: 1000; top: 16px; left: 16px; bottom: 16px; width: var(--sheet-w); max-width: calc(100% - 32px);
  display: flex; flex-direction: column; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  overflow: hidden;
}
.sheet-handle { display: none; }
.brand { display: flex; align-items: center; gap: 12px; padding: 18px 20px 6px; }
.brand-mark { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--accent); }
.brand-mark svg { width: 26px; height: 26px; fill: var(--accent-ink); stroke: var(--accent-ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.brand-mark svg path { fill: none; }
.brand-text { flex: 1; min-width: 0; }
.theme-btn { width: 40px; height: 40px; border-radius: 12px; }
.theme-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.brand h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 20px 20px; display: flex; flex-direction: column; gap: 16px; overscroll-behavior: contain; }
.credit { margin: 0; padding: 8px 20px 12px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }
.hint { margin: 0; color: var(--muted); font-size: 13px; }

/* the three people */
.plan { display: flex; flex-direction: column; gap: 14px; }
.people { position: relative; display: flex; flex-direction: column; gap: 14px; }
.people::before { /* dotted line linking the three people, like a journey */
  content: ""; position: absolute; left: 17px; top: 22px; bottom: 22px; border-left: 2px dotted var(--line);
}
.person { position: relative; margin: 0; padding: 0; border: 0; min-width: 0; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 4px 10px; }
.avatar {
  position: relative; z-index: 1; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%;
  background: var(--c); color: #fff; font-weight: 800; font-size: 15px; box-shadow: 0 0 0 3px var(--surface);
}
.person-main { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.field { display: flex; gap: 6px; }
.combo { position: relative; flex: 1; min-width: 0; display: flex; }
.combo input {
  width: 100%; min-width: 0; height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid transparent;
  background: var(--surface-2); color: var(--ink); font: 600 15px var(--font); text-overflow: ellipsis;
}
.combo input::placeholder { color: var(--muted); font-weight: 500; }
.combo input:focus { outline: none; border-color: var(--c); background: var(--surface); }
.combo-list {
  position: absolute; z-index: 1200; left: 0; right: 0; top: calc(100% + 6px); margin: 0; padding: 6px 0; list-style: none;
  max-height: 320px; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
}
.combo-list [role="option"] { padding: 10px 14px; cursor: pointer; font-size: 14px; font-weight: 500; }
.combo-list [role="option"][aria-selected="true"], .combo-list [role="option"]:hover { background: var(--surface-2); }
.combo-group { padding: 12px 14px 4px; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.combo-empty { padding: 10px 14px; color: var(--muted); font-size: 14px; }
.field-error { margin: 0; font-size: 13px; color: var(--warn); }
.icon-btn {
  flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; cursor: pointer;
  border: 0; background: var(--surface-2); color: var(--ink);
}
.icon-btn[aria-pressed="true"] { background: var(--c); color: #fff; }
.panel-body svg, .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* transport: icon chips, the chosen one shows its name */
.modes { display: flex; gap: 6px; }
.modes button {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); font-weight: 700; font-size: 13px;
}
.modes button span { display: none; }
.modes button[aria-checked="true"] { background: var(--c); border-color: var(--c); color: #fff; }
.modes button[aria-checked="true"] span { display: inline; }
.modes button svg { width: 18px; height: 18px; }

.primary {
  height: 54px; border: 0; border-radius: 14px; cursor: pointer; background: var(--accent); color: var(--accent-ink);
  font-weight: 800; font-size: 17px; letter-spacing: -0.01em; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent);
  transition: transform .1s ease;
}
.primary:active { transform: scale(0.98); }
.primary.ready { animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 50% { box-shadow: 0 6px 22px color-mix(in srgb, var(--accent) 60%, transparent); } }

/* ---------------------------------------------------------------- result */
#result { display: flex; flex-direction: column; gap: 10px; }
#result.stale .meet, #result.stale .routes { opacity: 0.4; }
.stale-note { display: none; margin: 8px 0 0; font-size: 13px; color: var(--muted); }
#result.stale .stale-note { display: block; }
.meet { padding: 16px; border-radius: 16px; background: var(--accent-soft); }
.meet.none { background: color-mix(in srgb, var(--warn) 12%, var(--surface)); }
.meet.none p { margin: 6px 0 0; }
.meet-head { display: flex; align-items: center; gap: 12px; }
.meet-icon { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--accent); }
.meet-icon svg { width: 20px; height: 20px; fill: var(--accent-ink); stroke: none; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.meet h2 { margin: 1px 0 0; font-size: 21px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; }
.where { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin: 12px 0 0; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; cursor: pointer;
  border: 0; background: var(--surface); font-weight: 700; font-size: 13px; color: var(--ink); box-shadow: var(--shadow-sm);
}
.big-time { font-size: 13px; color: var(--muted); font-weight: 600; }
.big-time strong { font-size: 22px; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.link { border: 0; background: none; padding: 0; color: var(--pa); cursor: pointer; font: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.reset { margin-top: 10px; font-size: 13px; }

/* one trip per person: avatar | journey chips | big time */
.routes { display: flex; flex-direction: column; gap: 8px; }
.route { border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.route.single { padding: 14px; }
.route summary { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; list-style: none; }
.route summary::-webkit-details-marker { display: none; }
.route[open] summary { border-bottom: 1px solid var(--line); }
.route .avatar { box-shadow: none; }
.legs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-width: 0; }
.leg { display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 8px; background: var(--surface-2); font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.leg svg { width: 15px; height: 15px; }
.leg-sep { color: var(--muted); font-size: 12px; }
.from { grid-column: 2; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -6px; }
.trip-time { grid-row: 1 / span 2; grid-column: 3; text-align: right; line-height: 1; }
.trip-time strong { display: block; font-size: 24px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.trip-time span { font-size: 11px; color: var(--muted); font-weight: 600; }
.route-body { padding: 12px 14px 14px; }
.route-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.act {
  display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; cursor: pointer;
  border: 0; border-radius: 999px; background: var(--c); color: #fff; font-weight: 700; font-size: 13px;
}
.act + .act { background: var(--surface-2); color: var(--ink); }
.act svg { width: 15px; height: 15px; }
.act[data-play] svg path, .act svg rect { fill: currentColor; }
.voice-opt { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.steps { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; counter-reset: s; }
.steps li { display: flex; gap: 10px; justify-content: space-between; padding: 8px 6px; border-radius: 8px; font-size: 14px; }
.steps li + li:not(.layer-sep) { border-top: 1px solid var(--line); }
.steps li:not(.layer-sep) span:first-child::before { counter-increment: s; content: counter(s) "  "; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.steps .t { flex: none; color: var(--muted); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.steps .layer-sep { padding: 12px 6px 4px; border: 0 !important; }
.steps .layer-sep .link { color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
.steps li.current { background: color-mix(in srgb, var(--c) 14%, var(--surface)); box-shadow: inset 3px 0 0 var(--c); }
.route .share { font-size: 13px; }

/* how it works */
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 6px; border-bottom: 1px solid var(--line); }
td { padding: 8px 6px; border-bottom: 1px solid var(--line); }
td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
th:not(:first-child) { text-align: right; }
td.max { font-weight: 800; }
.minimax tbody tr { cursor: pointer; }
.minimax tbody tr:hover, .minimax tr.sel { background: var(--surface-2); }
.minimax tr.sel { box-shadow: inset 3px 0 0 var(--accent); }
td.ok { color: var(--accent); font-weight: 800; }
td.bad { color: var(--warn); font-weight: 800; }
.hood { border-top: 1px solid var(--line); padding-top: 12px; }
.hood summary { cursor: pointer; font-weight: 700; font-size: 14px; color: var(--muted); }
.hood h3 { margin: 16px 0 4px; font-size: 14px; font-weight: 800; }
.explain { margin: 10px 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.toggle { display: flex; gap: 8px; align-items: center; margin: 12px 0 6px; font-size: 14px; }
code { font-size: 12px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

/* ---------------------------------------------------------------- phone: bottom sheet */
@media (max-width: 760px) {
  .sheet {
    top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-width: none; border-radius: 22px 22px 0 0;
    height: var(--sheet-h, 52vh); transition: height .25s ease; padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .sheet[data-state="peek"] { --sheet-h: 150px; }
  .sheet[data-state="half"] { --sheet-h: 52vh; }
  .sheet[data-state="full"] { --sheet-h: calc(100% - 64px); }
  .sheet-handle { display: grid; place-items: center; flex: none; height: 22px; border: 0; background: none; cursor: grab; padding: 0; }
  .sheet-handle span { width: 40px; height: 5px; border-radius: 99px; background: var(--line); }
  .brand { padding: 2px 16px 4px; }
  .brand h1 { font-size: 18px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 10px; }
  .brand-mark svg { width: 22px; height: 22px; }
  .panel-body { padding: 8px 16px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .credit { display: none; }
  .map-style { top: max(12px, env(safe-area-inset-top, 0px)); right: 12px; }
  .floors { top: 64px; right: 12px; }
  .map3d-msg { padding: 80px 24px; }
}
@media (prefers-reduced-motion: reduce) {
  .play-dot span, .primary.ready { animation: none; }
  .sheet, .leaflet-bottom { transition: none; }
}

/* ------------------------------------------------------------------ live group */
.group-bar { display: grid; gap: 10px; padding: 12px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface-2); }
.group-bar.live { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: var(--accent-soft); }
.group-intro { font-size: 13px; color: var(--muted); line-height: 1.4; }
.group-intro strong { color: var(--ink); display: block; font-size: 14px; }
.group-head { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.group-head .code { letter-spacing: .12em; font-variant-numeric: tabular-nums; }
.group-head .count { margin-left: auto; color: var(--muted); font-size: 13px; }
.group-actions, .join-row, .invite-link { display: flex; gap: 8px; flex-wrap: wrap; }
.act-pill { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.act-pill.strong { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.act-pill svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.act-pill:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 2px; }
.join-row input, .invite-link input { flex: 1; min-width: 0; min-height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font: inherit; }
.join-row input { text-transform: uppercase; letter-spacing: .15em; font-weight: 700; }
.invite { display: grid; gap: 10px; justify-items: center; padding: 12px; border-radius: 14px; background: var(--surface); }
.invite[hidden] { display: none; }
.invite-code { display: flex; gap: 6px; }
.invite-code span { width: 38px; height: 46px; display: grid; place-items: center; border-radius: 10px; background: var(--surface-2);
  font-size: 24px; font-weight: 800; color: var(--ink); }
.qr { width: 168px; height: 168px; padding: 6px; border-radius: 12px; background: #fff; }   /* QR stays black on white for scanners */
.qr svg { width: 100%; height: 100%; display: block; }
.invite .hint { text-align: center; }
.invite-link { width: 100%; }
.live-dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); animation: live 1.8s infinite; vertical-align: 1px; }
@keyframes live { 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
.seat-status { grid-column: 1 / -1; margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.person.remote { opacity: .92; }
.person.remote input, .person.remote button { cursor: default; }
.person.me .avatar { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--c); }
.you-chip { align-self: center; padding: 2px 8px; border-radius: 999px; background: var(--c); color: #fff; font-size: 11px; font-weight: 700; }
.group-wait { padding: 14px 4px; text-align: center; }
[hidden] { display: none !important; }

/* ------------------------------------------------------------------ how many people */
.count-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px; font-weight: 700; }
.stepper { display: flex; align-items: center; gap: 4px; padding: 3px; border-radius: 999px; background: var(--surface-2); }
.stepper .icon-btn { width: 36px; height: 36px; border-radius: 50%; font-size: 20px; font-weight: 700; line-height: 1; background: var(--surface); }
.stepper .icon-btn:disabled { opacity: .35; cursor: default; }
.stepper output { min-width: 82px; text-align: center; font-weight: 600; color: var(--muted); }
.stepper output strong { color: var(--ink); font-size: 17px; }

/* ------------------------------------------------------------------ my location */
.icon-btn .fill { fill: currentColor; stroke: none; }
.icon-btn.busy svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .icon-btn.busy svg { animation: none; opacity: .5; } }
.gps-note { margin: 0; font-size: 12.5px; line-height: 1.4; color: var(--muted); }
.gps-note strong { color: var(--ink); }
.approach { display: flex; gap: 8px; align-items: flex-start; margin: 4px 0 10px; padding: 10px 12px; border-radius: 12px;
  background: var(--surface-2); font-size: 13.5px; line-height: 1.4; }
.approach svg { flex: none; width: 18px; height: 18px; margin-top: 1px; fill: none; stroke: var(--c); stroke-width: 2; }
.approach svg .fill { fill: var(--c); }

 * (Firebase console → Project settings → Your apps → Web app → "firebaseConfig").
 *

 */

<script>/*
 * Rendez-vous Campus — live groups.
 *
 * A group is 2 to 6 seats (A, B, C…). Each phone takes one seat and writes only its own
 * position and transport. Every phone reads all three seats and runs the same Dijkstra + minimax
 * locally, so all phones show the same meeting point without the server computing anything.
 *
 * Data:   groups/<CODE> = { size, seats: { <A..F>: { node, mode, gps: { m, off, acc } | null, online, at, by } } }
 *        (gps holds only the distance to the campus, never coordinates)
 *
 * Two backends with the same interface:
 *   - Firebase Realtime Database (between phones), when window.RDV_FIREBASE is set in js/config.js
 *   - "local" (BroadcastChannel + localStorage): between tabs of the same browser, for testing
 */
(function (root) {
  'use strict';
  const SEATS = ['A', 'B', 'C', 'D', 'E', 'F'];
  const FB = 'https://cdn.jsdelivr.net/npm/firebase@10.12.2/';

  /** Short code without look-alike characters (no 0/O, 1/I/L). */
  function newCode() {
    const abc = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    let s = '';
    const r = (root.crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint32Array(5)) : [0, 0, 0, 0, 0].map(() => Math.random() * 1e9);
    for (let k = 0; k < 5; k++) s += abc[r[k] % abc.length];
    return s;
  }
  /** One id per browser tab (survives a refresh), so a phone gets its own seat back but never takes someone else's. */
  const CLIENT = (() => {
    try { let id = sessionStorage.getItem('rdv-client'); if (!id) { id = newCode() + newCode(); sessionStorage.setItem('rdv-client', id); } return id; }
    catch (e) { return newCode() + newCode(); }
  })();
  /** A seat can be taken if it is empty, its phone went offline, or it is already mine. */
  const free = cur => !cur || cur.online === false || cur.by === CLIENT;
  /** My own seat first (after a refresh), then the one asked for, then A, B, C. */
  const seatOrder = (seats, preferred, size) => {

    const mine = all.filter(k => seats[k] && seats[k].by === CLIENT);

    const db = app.database();

      kind: 'firebase',
      async exists(code) { return (await db.ref('groups/' + code).once('value')).exists(); },
      async create(code, size) { await db.ref('groups/' + code).set({ created: root.firebase.database.ServerValue.TIMESTAMP, size: size || 3 }); },
      async size(code) { return (await db.ref('groups/' + code + '/size').once('value')).val() || 3; },
      /** Take the first free seat (a transaction, so two phones never get the same letter). */
      async claim(code, preferred, data, size) {
        const seats = (await db.ref('groups/' + code + '/seats').once('value')).val() || {};
        const order = seatOrder(seats, preferred, size);
        for (const seat of order) {
          const ref = db.ref('groups/' + code + '/seats/' + seat);
          const res = await ref.transaction(cur => free(cur) ? Object.assign({}, data, { by: CLIENT, online: true, at: Date.now() }) : undefined);
          if (res.committed) { ref.child('online').onDisconnect().set(false); return seat; }
        }
        return null;
      },
      write(code, seat, data) { return db.ref('groups/' + code + '/seats/' + seat).update(Object.assign({}, data, { by: CLIENT, online: true, at: Date.now() })); },
      subscribe(code, cb) {

    const key = code => 'rdv-group-' + code;
    const read = code => { try { return JSON.parse(localStorage.getItem(key(code)) || 'null'); } catch (e) { return null; } };
    const chan = 'BroadcastChannel' in root ? new BroadcastChannel('rdv-groups') : null;

      if (chan) chan.postMessage(code);

    };
    if (chan) chan.onmessage = ev => listeners.forEach(l => l(ev.data));
    root.addEventListener('storage', ev => { if (ev.key && ev.key.startsWith('rdv-group-')) listeners.forEach(l => l(ev.key.slice(10))); });

      const g = read(code); if (g && g.seats && g.seats[seat]) { g.seats[seat].online = false; save(code, g); }
    }));
    return {
      kind: 'local',
      async exists(code) { return !!read(code); },
      async create(code, size) { save(code, { created: Date.now(), size: size || 3, seats: {} }); },
      async size(code) { const g = read(code); return (g && g.size) || 3; },
      async claim(code, preferred, data, size) {
        const g = read(code) || { seats: {} }; g.seats = g.seats || {};
        const seats = g.seats;
        const order = seatOrder(seats, preferred, size);

        if (!seat) return null;
        g.seats[seat] = Object.assign({}, data, { by: CLIENT, online: true, at: Date.now() });
        save(code, g); mySeats.push([code, seat]);
        return seat;
      },
      async write(code, seat, data) {
        const g = read(code); if (!g) return;
        g.seats[seat] = Object.assign({}, g.seats[seat] || {}, data, { by: CLIENT, online: true, at: Date.now() });
        save(code, g);
      },
      subscribe(code, cb) {
        const l = c => { if (c === code) { const g = read(code); cb((g && g.seats) || {}); } };
        listeners.add(l); l(code);
        return () => listeners.delete(l);
      },
      async leave(code, seat) { const g = read(code); if (g && g.seats) { delete g.seats[seat]; save(code, g); } }
    };
  }

  let backend = null;
  async function getBackend() {
    if (backend) return backend;
    backend = root.RDV_FIREBASE ? await firebaseBackend(root.RDV_FIREBASE) : localBackend();
    return backend;
  }

  root.RDVSync = { SEATS, newCode, getBackend, isShared: () => !!root.RDV_FIREBASE };

<script>/*
 * Rendez-vous Campus — graph model and algorithms.
 *
 *   1. buildGraph()      JSON (nodes + edges)  ->  one weighted graph per transport mode
 *   2. dijkstra()        shortest times from one node (binary-heap Dijkstra)
 *   3. allPairs()        Dijkstra from every node  ->  distance matrix D + predecessor matrix P
 *   4. isTransitive()    3-loop check: is D[i][j] <= D[i][k] + D[k][j] for every i, j, k ?
 *   5. meetingPoint()    minimax: the place that minimises the LONGEST travel time
 *   6. rebuildPath() / itinerary()   path + step-by-step directions for each person
 *
 * Weights are travel times in seconds. Unreachable = Infinity.
 * Works in the browser (window.RDV) and in Node (require).
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.RDV = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---------------------------------------------------------------- settings
  const DEFAULT_SETTINGS = {
    modes: {
      walk:       { label: 'Walk',       speedIndoor: 1.3, speedOutdoor: 1.3 },
      wheelchair: { label: 'Wheelchair', speedIndoor: 1.0, speedOutdoor: 1.0 },
      // A cyclist rides outdoors, then parks and walks inside.
      bike:       { label: 'Bike',       speedIndoor: 1.3, speedOutdoor: 4.5, parkSeconds: 30 }
    },
    vertical: { stairs: 20, spiral: 25, elevator: 30 }, // seconds per floor
    elevatorWait: 20                                    // seconds, added once per elevator ride
  };
  const MODES = Object.keys(DEFAULT_SETTINGS.modes);
  const VERTICAL = { stairs: true, spiral: true, elevator: true };

  // ---------------------------------------------------------------- graph
  /**
   * Merge several JSON graph files into one graph and precompute, for every
   * mode, an adjacency list of { to, w, e, dir } (w = seconds, e = edge index).
   */
  function buildGraph(dataFiles, settings) {
    settings = Object.assign({}, DEFAULT_SETTINGS, settings || {});
    const nodes = [], edges = [], layers = [], index = new Map();
    const scaleByLayer = {};

    for (const file of dataFiles) {
      for (const l of file.layers || []) {
        layers.push(l);
        scaleByLayer[l.id] = (file.meta && file.meta.scale_m_per_px) || null;
      }
      for (const n of file.nodes) {
        if (index.has(n.id)) throw new Error('Duplicate node id: ' + n.id);
        index.set(n.id, nodes.length);
        nodes.push(n);
      }
    }
    for (const file of dataFiles) {
      for (const e of file.edges) {
        if (!index.has(e.from) || !index.has(e.to))
          throw new Error('Edge ' + e.from + ' -> ' + e.to + ' uses an unknown node');
        const a = nodes[index.get(e.from)], b = nodes[index.get(e.to)];
        let length = e.length_m;
        if (length == null && !VERTICAL[e.kind] && a.layer === b.layer && scaleByLayer[a.layer]) {
          length = Math.hypot(a.x - b.x, a.y - b.y) * scaleByLayer[a.layer];
        }
        edges.push(Object.assign({}, e, {
          a: index.get(e.from), b: index.get(e.to),
          length: length == null ? 0 : length,
          outdoor: a.layer === 'out' && b.layer === 'out',
          // a door into/out of an elevator: half the waiting time on each side,
          // so one ride costs one wait whatever the number of floors
          elevatorDoor: !VERTICAL[e.kind] && ((a.type === 'elevator') !== (b.type === 'elevator'))
        }));
      }
    }

    const adj = {};
    for (const mode of MODES) {
      adj[mode] = nodes.map(() => []);
      edges.forEach((e, ei) => {
        const w = edgeSeconds(e, mode, settings);
        if (!isFinite(w)) return;
        adj[mode][e.a].push({ to: e.b, w, e: ei, dir: 'fwd' });
        if (!e.oneway) adj[mode][e.b].push({ to: e.a, w, e: ei, dir: 'back' });
      });
    }
    return { nodes, edges, layers, index, adj, settings };
  }

  /** Travel time of one edge for one mode, in seconds (Infinity = not allowed). */
  function edgeSeconds(e, mode, settings) {
    const m = settings.modes[mode];
    if (e.access && e.access[mode] === false) return Infinity;
    if (mode === 'wheelchair' && (e.kind === 'stairs' || e.kind === 'spiral')) return Infinity;
    if (VERTICAL[e.kind]) return settings.vertical[e.kind] * (e.floors || 1);
    const speed = e.outdoor ? m.speedOutdoor : m.speedIndoor;
    let t = e.length / speed;
    if (e.kind === 'stairs_outdoor') t = e.length / (settings.modes.walk.speedIndoor * 0.55);   // steps: about half walking speed
    if (e.elevatorDoor) t += settings.elevatorWait / 2;
    if (mode === 'bike' && e.kind === 'entrance') t += m.parkSeconds || 0; // park the bike
    return t;
  }

  // ---------------------------------------------------------------- Dijkstra
  /** Minimal binary min-heap of [priority, node]. */
  class MinHeap {
    constructor() { this.a = []; }
    get size() { return this.a.length; }
    push(p, v) {
      const a = this.a; a.push([p, v]);
      let i = a.length - 1;
      while (i > 0) {
        const parent = (i - 1) >> 1;
        if (a[parent][0] <= a[i][0]) break;
        [a[parent], a[i]] = [a[i], a[parent]]; i = parent;
      }
    }
    pop() {
      const a = this.a, top = a[0], last = a.pop();
      if (a.length) {
        a[0] = last;
        let i = 0;
        for (;;) {
          const l = 2 * i + 1, r = l + 1; let m = i;
          if (l < a.length && a[l][0] < a[m][0]) m = l;
          if (r < a.length && a[r][0] < a[m][0]) m = r;
          if (m === i) break;
          [a[m], a[i]] = [a[i], a[m]]; i = m;
        }
      }
      return top;
    }
  }

  /**
   * Dijkstra from `source` on one mode's adjacency list.
   * Returns dist[v] (seconds), prev[v] (previous node) and prevEdge[v].
   * `onVisit(v, dist)` is optional, e.g. to animate the visiting order.
   */
  function dijkstra(adj, source, onVisit) {
    const n = adj.length;
    const dist = new Float64Array(n).fill(Infinity);
    const prev = new Int32Array(n).fill(-1);
    const prevEdge = new Array(n).fill(null);
    const done = new Uint8Array(n);
    const heap = new MinHeap();
    dist[source] = 0; heap.push(0, source);
    while (heap.size) {
      const [d, u] = heap.pop();
      if (done[u]) continue;
      done[u] = 1;
      if (onVisit) onVisit(u, d);
      for (const { to, w, e, dir } of adj[u]) {
        const nd = d + w;
        if (nd < dist[to]) {
          dist[to] = nd; prev[to] = u; prevEdge[to] = { e, dir };
          heap.push(nd, to);
        }
      }
    }
    return { dist, prev, prevEdge };
  }

  /** Run Dijkstra from every node: D[s][t] = shortest time, P[s] = predecessors. */
  function allPairs(graph, mode) {
    const t0 = now();
    const D = [], P = [], PE = [];
    for (let s = 0; s < graph.nodes.length; s++) {
      const r = dijkstra(graph.adj[mode], s);
      D.push(r.dist); P.push(r.prev); PE.push(r.prevEdge);
    }
    return { mode, D, P, PE, runs: graph.nodes.length, ms: now() - t0 };
  }

  // ---------------------------------------------------------------- IsTransitive
  /**
   * The professor's "IsTransitive with 3 loops" (same loops as Floyd–Warshall).
   * Works on a copy of D. If D came from Dijkstra it is already complete,
   * so the expected result is 0 updates. Any update means a data problem
   * (e.g. a one-way edge or a negative weight).
   */
  function isTransitive(D, eps) {
    eps = eps == null ? 1e-9 : eps;
    const n = D.length;
    const M = D.map(row => Float64Array.from(row));
    let updates = 0; const examples = [];
    for (let k = 0; k < n; k++)
      for (let i = 0; i < n; i++) {
        const dik = M[i][k]; if (dik === Infinity) continue;
        for (let j = 0; j < n; j++) {
          const via = dik + M[k][j];
          if (via + eps < M[i][j]) {
            updates++;
            if (examples.length < 5) examples.push({ i, j, k, before: M[i][j], after: via });
            M[i][j] = via;
          }
        }
      }
    return { ok: updates === 0, updates, examples, matrix: M };
  }

  // ---------------------------------------------------------------- meeting point
  /**
   * Minimax meeting point (graph 1-center restricted to `candidates`).
   * people: [{ node: index, matrix: allPairs result for that person's mode }]
   * Score of v = max_i D_i[start_i][v]; ties broken by the sum of times.
   * Returns all candidates, best first.
   */
  function meetingPoint(people, candidates) {
    const ranked = candidates.map(v => {
      const times = people.map(p => (p.extra || 0) + p.matrix.D[p.node][v]);   // extra: time to reach the campus first (GPS off campus)
      return { node: v, times, max: Math.max(...times), sum: times.reduce((s, t) => s + t, 0) };
    });
    ranked.sort((x, y) => (x.max - y.max) || (x.sum - y.sum));
    return ranked;
  }

  // ---------------------------------------------------------------- paths + directions
  /** Follow predecessors back from t to s. Returns [] if unreachable. */
  function rebuildPath(matrix, s, t) {
    if (matrix.D[s][t] === Infinity) return [];
    const prev = matrix.P[s], path = [t];
    let v = t;
    while (v !== s) { v = prev[v]; if (v < 0) return []; path.push(v); }
    return path.reverse();
  }

  /**
   * Step-by-step directions from s to t. Consecutive outdoor steps on the
   * same street are merged ("Walk along Allée Lou Blazer to Bât. C").
   */
  function itinerary(graph, matrix, s, t) {
    const path = rebuildPath(matrix, s, t);
    const steps = [];
    const verb = matrix.mode === 'bike' ? 'Ride' : matrix.mode === 'wheelchair' ? 'Go' : 'Walk';
    for (let i = 1; i < path.length; i++) {
      const u = path[i - 1], v = path[i];
      const pe = matrix.PE[s][v];
      const e = graph.edges[pe.e];
      const w = edgeSeconds(e, matrix.mode, graph.settings);
      const to = graph.nodes[v];
      const step = { from: u, to: v, seconds: w, meters: e.length, kind: e.kind,
                     layer: to.layer, fromLayer: graph.nodes[u].layer, via: e.via || null };
      const last = steps[steps.length - 1];
      if (VERTICAL[e.kind]) {
        // one step per ride, however many floors: "Take the elevator up to Bât. C · 2e."
        const word = e.kind === 'elevator' ? 'the elevator' : e.kind === 'spiral' ? 'the spiral staircase' : 'the stairs';
        const startFloor = last && last.kind === e.kind ? last.startFloor : graph.nodes[u].floor;
        const up = to.floor > startFloor ? 'up' : 'down';
        const text = 'Take ' + word + ' ' + up + ' to ' + floorName(graph, to.layer) + '.';
        if (last && last.kind === e.kind) {
          last.to = v; last.seconds += w; last.text = text; last.layer = to.layer; last.path.push(v);
          continue;
        }
        step.text = text; step.startFloor = graph.nodes[u].floor;
      } else if (e.kind === 'stairs_outdoor') {
        // OSM tells which way is up; going against the link reverses it
        const up = e.incline ? (pe.dir === 'fwd' ? e.incline === 'up' : e.incline === 'down') : null;
        step.text = (up == null ? 'Take the steps' : up ? 'Go up the steps' : 'Go down the steps') +
          (e.step_count ? ' (' + e.step_count + ' steps)' : '') + '.';
      } else if (e.instr && e.instr[pe.dir] && e.instr[pe.dir] !== 'TBD') {
        step.text = e.instr[pe.dir];
      } else if (e.via) {
        const v2 = matrix.mode === 'bike' && e.outdoor ? 'Ride' : (matrix.mode === 'bike' ? 'Walk' : verb);
        step.text = v2 + ' along ' + e.via + ' to ' + to.name + '.';
      } else {
        step.text = 'Go to ' + to.name + '.';
      }
      // merge consecutive steps on the same outdoor street
      if (last && e.via && last.via === e.via && !e.instr && last.kind === e.kind) {
        last.to = v; last.seconds += w; last.meters += e.length;
        last.text = last.text.replace(/ to .*\.$/, ' to ' + to.name + '.');
        last.path.push(v);
      } else {
        step.path = [u, v];
        steps.push(step);
      }
    }
    // A street step that ends at a plain junction names the next street instead
    // ("Walk along Allée Lou Blazer to the junction with the entrance path.")
    steps.forEach((st, i) => {
      const end = graph.nodes[st.to];
      if (!st.via || end.type !== 'junction') return;
      const next = steps[i + 1];
      st.text = st.text.replace(/ to .*\.$/, next && next.via && next.via !== st.via
        ? ' to the junction with ' + next.via + '.' : '.');
    });
    return { path, steps, seconds: matrix.D[s][t] };
  }

  function floorName(graph, layerId) {
    const l = graph.layers.find(x => x.id === layerId);
    return l ? l.name : layerId;
  }

  /** Is every candidate reachable from every node? Returns unreachable pairs (for tests/debug). */
  function unreachable(matrix, from, to) {
    const out = [];
    for (const s of from) for (const t of to) if (matrix.D[s][t] === Infinity) out.push([s, t]);
    return out;
  }

  function formatTime(sec) {
    if (!isFinite(sec)) return 'unreachable';
    sec = Math.round(sec);
    if (sec < 60) return sec + ' s';
    const m = Math.floor(sec / 60), s = sec % 60;
    return s ? m + ' min ' + String(s).padStart(2, '0') + ' s' : m + ' min';
  }

  function now() { return (typeof performance !== 'undefined' ? performance : Date).now(); }

  return { DEFAULT_SETTINGS, MODES, buildGraph, edgeSeconds, dijkstra, allPairs, isTransitive,
           meetingPoint, rebuildPath, itinerary, unreachable, formatTime, MinHeap };
});

<script>/*
 * Rendez-vous Campus — user interface.
 * Depends on Leaflet (global L) and js/algorithms.js (global RDV).
 * Data comes from window.CAMPUS_DATA (single-file build) or from data/*.json.
 */
(async function () {
  'use strict';

  // ------------------------------------------------------------------ data
  const data = window.CAMPUS_DATA || {
    outdoor: await fetch('data/outdoor.json').then(r => r.json()),
    indoor: await fetch('data/indoor_batC.json').then(r => r.json())

  const graph = RDV.buildGraph([data.outdoor, data.indoor]);
  const N = graph.nodes;
  const idx = id => graph.index.get(id);

  // All-pairs Dijkstra once per mode, then IsTransitive as a check.
  const matrices = {}, checks = {};
  for (const mode of RDV.MODES) {
    matrices[mode] = RDV.allPairs(graph, mode);
    const t0 = performance.now();
    checks[mode] = RDV.isTransitive(matrices[mode].D);
    checks[mode].ms = performance.now() - t0;
  }
  const candidates = N.map((n, i) => (n.meetable ? i : -1)).filter(i => i >= 0);

  const LAYER_SHORT = { out: 'Campus', C0: 'RDC', C1: '1er', C2: '2e' };
  const MODE_LABEL = { walk: 'Walk', wheelchair: 'Wheelchair', bike: 'Bike' };

  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  // ------------------------------------------------------------------ state
  const KEYS = 'ABCDEF', MIN_PEOPLE = 2, MAX_PEOPLE = KEYS.length;
  const START_AT = ['C2_TP6', 'OUT_RESTO', 'OUT_AMPHI13', 'OUT_BU', 'OUT_MEMO', 'OUT_GACO'];
  const START_MODE = ['walk', 'bike', 'wheelchair', 'walk', 'walk', 'walk'];
  const makePerson = i => ({ key: KEYS[i], colorVar: '--p' + KEYS[i].toLowerCase(),
    node: idx(START_AT[i]) != null ? idx(START_AT[i]) : idx('OUT_BU'), mode: START_MODE[i], gps: null });
  const DEFAULT_PEOPLE = [0, 1, 2].map(makePerson);
  /** Change how many people meet; the ones already set keep their place. */
  function setCount(n) {
    n = Math.max(MIN_PEOPLE, Math.min(MAX_PEOPLE, n));
    while (state.people.length < n) state.people.push(makePerson(state.people.length));
    state.people.length = n;
  }

    people: loadPeople() || DEFAULT_PEOPLE.map(p => Object.assign({}, p)),
    layer: 'out',
    picking: null,      // index of the person whose position is being tapped
    chosen: null,       // meeting point picked by hand from the table (null = best)
    showGraph: false,
    single: null        // { from, to, mode } when opened from a shared route link
  };

  function loadPeople() {
    try {
      const saved = JSON.parse(localStorage.getItem('rdv-people') || 'null');
      if (!Array.isArray(saved) || saved.length < MIN_PEOPLE || saved.length > MAX_PEOPLE) return null;
      return saved.map((sv, i) => {
        const node = idx(sv.id);
        return Object.assign(makePerson(i), node == null ? {} : { node, mode: sv.mode });
      });
    } catch (e) { return null; }
  }

    try {
      localStorage.setItem('rdv-people', JSON.stringify(state.people.map(p => ({ id: N[p.node].id, mode: p.mode }))));
    } catch (e) { /* storage unavailable: fine */ }

  // ------------------------------------------------------------------ map
  // Everything is in real coordinates (lat/lng). The campus is drawn from OpenStreetMap data
  // shipped with the app, so it works offline; real map tiles can be switched on when online.
  const map = L.map('map', { zoomSnap: 0.25, maxZoom: 21, zoomControl: false, attributionControl: true });
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  const PHONE = window.matchMedia('(max-width: 760px)');

  function fitPad() {
    if (PHONE.matches) return { paddingTopLeft: [16, 64], paddingBottomRight: [76, $sheet.offsetHeight + 16] };
    return { paddingTopLeft: [$sheet.offsetWidth + 40, 70], paddingBottomRight: [84, 24] };
  }
  map.attributionControl.setPrefix(false);
  map.attributionControl.addAttribution('© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors');
  const ll = n => [n.lat, n.lng];
  const layerGroups = {};
  const baseGroup = L.layerGroup().addTo(map);
  const routeGroup = L.layerGroup().addTo(map);
  const markerGroup = L.layerGroup().addTo(map);
  const graphGroup = L.layerGroup().addTo(map);
  const playGroup = L.layerGroup().addTo(map);

      graphGroup.addLayer(L.circleMarker(ll(n), { radius: n.type === 'junction' ? 3 : 5, className: 'graph-node' + (n.meetable ? ' meetable' : ''), weight: 1.5 })
        .bindTooltip(esc(n.id) + '<br>' + esc(n.name) + '<br>' + n.lat.toFixed(6) + ', ' + n.lng.toFixed(6)));
    });
  }

  // ------------------------------------------------------------------ map clicks
  map.on('click', ev => {
    const $c = document.getElementById('coords');
    if ($c) $c.textContent = ev.latlng.lat.toFixed(6) + ', ' + ev.latlng.lng.toFixed(6) + ' · layer ' + state.layer;
    if (state.picking == null) return;
    const best = nearestPlace(ev.latlng, state.layer);
    if (best != null) {
      setPlace(state.picking, best);
      stopPicking();
      drawPending();
    }
  });

  /** Closest place a person can stand at, on one layer. */
  function nearestPlace(latlng, layer) {
    let best = null, bd = Infinity;
    N.forEach((n, i) => {
      // on the campus view, Bât. C's ground floor counts too (tap the building to choose it)
      if (!PICKABLE(n) || !(n.layer === layer || (layer === 'out' && n.layer === 'C0'))) return;
      const d = map.distance(latlng, ll(n));
      if (d < bd) { bd = d; best = i; }
    });
    return best;
  }

  // ------------------------------------------------------------------ panel
  // Simple flow: 2–6 "Where are you?" fields + transport, one button, one result.
  const $panel = document.getElementById('panel-body');
  const ICON = {
    walk: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="4" r="2.2"/><path d="M13 7.5l-2.5 5 3 3-1 5.5M10.5 12.5L8 21M11.5 9L8 11.5v3M13.5 9l3 3.5h2.5"/></svg>',
    wheelchair: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="4" r="2.2"/><path d="M10 7.5v6h5.5l2 5.5M10 10.5h5"/><path d="M7.5 10.8a5.5 5.5 0 1 0 7.6 6.9"/></svg>',
    bike: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="16" r="3.5"/><circle cx="18.5" cy="16" r="3.5"/><path d="M5.5 16l4-7.5h6l3 7.5M9.5 8.5l3.5 7.5H5.5M14 5.5h3"/></svg>',
    pin: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.8-6.5-11.2a6.5 6.5 0 1 1 13 0C18.5 15.2 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.3"/></svg>',
    locate: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2.2" class="fill"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>'
  };
  const placeLabel = i => {
    const n = N[i];
    return (n.code ? n.code + ' – ' : '') + n.name + ' · ' + (LAYER_SHORT[n.layer] === 'Campus' ? 'Campus' : 'Bât. C ' + LAYER_SHORT[n.layer]);
  };
  const GROUP_ORDER = ['C0', 'C1', 'C2', 'out'];
  const groupName = l => l === 'out' ? 'Campus' : 'Bât. C · ' + LAYER_SHORT[l];
  const shortLabel = i => { const n = N[i]; return (n.code ? n.code + ' – ' : '') + n.name; };
  const places = N.map((n, i) => i).filter(i => PICKABLE(N[i]))
    .sort((a, b) => GROUP_ORDER.indexOf(N[a].layer) - GROUP_ORDER.indexOf(N[b].layer) ||
      (N[a].code ? 0 : 1) - (N[b].code ? 0 : 1) || shortLabel(a).localeCompare(shortLabel(b), 'fr', { numeric: true }));
  const byLabel = new Map(places.map(i => [placeLabel(i).toLowerCase(), i]));

  /** Turn what was typed into a place: exact label, room number ("c104"), or a unique partial match. */
  function resolvePlace(text) {
    const t = text.trim().toLowerCase();
    if (!t) return null;
    if (byLabel.has(t)) return byLabel.get(t);
    const code = places.find(i => (N[i].code || '').toLowerCase() === t);
    if (code != null) return code;
    const hits = places.filter(i => placeLabel(i).toLowerCase().includes(t));
    return hits.length === 1 ? hits[0] : null;
  }

  function renderForm() {
    const n = state.people.length;
    let html = '<form id="plan" class="plan" novalidate>' + groupBarHtml() +
      (state.group ? '' : '<div class="count-row"><span id="count-label">Who\'s meeting?</span><div class="stepper" role="group" aria-labelledby="count-label">' +
        '<button type="button" class="icon-btn" data-count="-1" aria-label="One person fewer"' + (n <= MIN_PEOPLE ? ' disabled' : '') + '>−</button>' +
        '<output aria-live="polite"><strong>' + n + '</strong> people</output>' +

      '<div class="people">';

      html += '<fieldset class="person' + (ro ? ' remote' : '') + (state.group && state.group.idx === i ? ' me' : '') + '" id="person-' + i + '" style="--c:var(' + p.colorVar + ')"' + (ro ? ' disabled' : '') + '><legend class="visually-hidden">Person ' + p.key + '</legend>' +
        '<span class="avatar" aria-hidden="true">' + p.key + '</span><div class="person-main">' +

        '<ul class="combo-list" id="list-' + i + '" role="listbox" aria-label="Places" hidden></ul></div>' +

        '<button type="button" class="icon-btn" data-tap="' + i + '" aria-pressed="false" title="Pick on the map" aria-label="Pick person ' + p.key + ' on the map">' + ICON.pin + '</button></div>' +
        '<p class="gps-note" id="gps-' + i + '"' + (p.gps ? '' : ' hidden') + '>' + gpsNote(i) + '</p>' +
        '<p class="field-error" id="err-' + i + '" hidden>Pick a place from the list, or type a room number like C104.</p>' +
        (state.group ? '<p class="seat-status" id="seat-' + i + '">' + seatStatus(i) + '</p>' : '') +
        '<div class="modes" role="radiogroup" aria-label="How does ' + p.key + ' travel?">' +
        RDV.MODES.map(mode => '<button type="button" role="radio" aria-checked="' + (p.mode === mode) + '" aria-label="' + MODE_LABEL[mode] + '" title="' + MODE_LABEL[mode] + '" data-i="' + i + '" data-mode="' + mode + '">' +
          ICON[mode] + '<span>' + MODE_LABEL[mode] + '</span></button>').join('') +

  function markStale() {
    if (playing) stopPlayback();
    state.chosen = null; state.stale = true;
    drawPending();
    const $r = document.getElementById('result');
    if ($r) $r.classList.add('stale');
    document.getElementById('find').classList.add('ready');
  }

  function renderPanel() {
    if (playing) stopPlayback();
    if (result.single) return renderSingle();

      '<h2>' + esc((m.code ? m.code + ' – ' : '') + m.name) + '</h2></div></div>' +

      (custom ? '<button type="button" class="link reset" data-reset>Use the best place instead (' + RDV.formatTime(best.max) + ')</button>' : '') +

    html += '<section class="routes" aria-label="Trips">';

      const r = routes[i];

      html += '<details class="route' + (mine ? ' mine' : '') + '" id="route-' + i + '" style="--c:var(' + p.colorVar + ')"' + (mine ? ' open' : '') + '>' +
        '<summary aria-label="Directions for ' + p.key + (mine ? ' (you)' : '') + '"><span class="avatar">' + p.key + '</span>' + (mine ? '<span class="you-chip">You</span>' : '') + legsHtml(r, p.mode) +
        '<span class="trip-time"><strong>' + clock(r.seconds) + '</strong><span>min</span></span>' +
        '<span class="from">from ' + esc(p.gps ? (p.gps.off ? 'off campus' : 'your location') : N[p.node].name) + '</span></summary>' +
        '<div class="route-body">' + actionsHtml(i, r) + approachHtml(r, p) + stepsHtml(r) + '<button type="button" class="link share" data-share="' + i + '">Copy link to this route</button></div></details>';
    });
    html += '</section>' + hoodHtml(ranked, meet);
