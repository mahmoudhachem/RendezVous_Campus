# Publishes the app on GitHub Pages and writes js/config.js from the repository secret FIREBASE_CONFIG,
# so the Firebase config is never committed to the repository.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write js/config.js from the FIREBASE_CONFIG secret
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "No FIREBASE_CONFIG secret: groups will only work between tabs of one browser."
            echo "window.RDV_FIREBASE = null;" > js/config.js
          else
            printf 'window.RDV_FIREBASE = %s;\n' "$FIREBASE_CONFIG" > js/config.js
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
